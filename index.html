<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Guessing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .game-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .attempt-counter {
            text-align: center;
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .comparison-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .comparison-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 15px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .field-name {
            font-weight: bold;
            color: #333;
            word-break: break-word;
        }

        .field-value {
            word-break: break-word;
            line-height: 1.5;
        }

        .green {
            color: #22863a;
            background: #f0f9f4;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
        }

        .red {
            color: #cb2431;
            background: #ffeef0;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            background: #ffeef0;
            color: #cb2431;
            border: 2px solid #cb2431;
        }

        .success {
            background: #f0f9f4;
            color: #22863a;
            border: 2px solid #22863a;
        }

        .info {
            background: #eff7ff;
            color: #0366d6;
            border: 2px solid #0366d6;
        }

        .guess-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
        }

        .guesses-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .guesses-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        #guessesTableContainer {
            max-height: 300px;
            overflow-y: auto;
            overflow-x: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        #guessesTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
            white-space: normal;
        }

        #guessesTable thead {
            position: sticky;
            top: 0;
            background: #667eea;
            color: white;
            z-index: 10;
        }

        #guessesTable th {
            padding: 12px 8px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #667eea;
            min-width: 100px;
        }

        #guessesTable th.attempt-col {
            min-width: 60px;
            width: 60px;
        }

        #guessesTable th.tea-name-col {
            min-width: 150px;
        }

        #guessesTable th.result-col {
            min-width: 90px;
        }

        #guessesTable th.detail-col {
            min-width: 120px;
            font-size: 0.85em;
            max-width: 200px;
            word-break: break-word;
        }

        #guessesTable td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: top;
        }

        #guessesTable td.attempt-col {
            font-weight: bold;
            text-align: center;
            width: 60px;
        }

        #guessesTable td.tea-name-col {
            font-weight: 600;
            min-width: 150px;
        }

        #guessesTable td.result-col {
            min-width: 90px;
        }

        #guessesTable td.detail-col {
            font-size: 0.85em;
            min-width: 120px;
            max-width: 200px;
            word-wrap: break-word;
        }

        #guessesTable tr:hover {
            background: #f5f5f5;
        }

        #guessesTable tr.correct {
            background: #f0f9f4;
        }

        #guessesTable tr.correct td.result-col {
            color: #22863a;
            font-weight: bold;
        }

        #guessesTable tr:not(.correct) td.result-col {
            color: #cb2431;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .comparison-row {
                grid-template-columns: 100px 1fr;
            }

            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍵 Tea Guessing Game</h1>
        <p class="subtitle">Can you guess the tea?</p>

        <div class="game-section">
            <div class="input-group">
                <input type="text" id="guessInput" placeholder="Enter a tea name..." autocomplete="off">
                <button id="guessButton" onclick="makeGuess()">Guess</button>
                <button id="newGameButton" onclick="startNewGame()" style="display: none; background: #28a745;">New Game</button>
            </div>
        </div>

        <div id="messageContainer"></div>
        <div id="attemptCounter" class="attempt-counter hidden">Attempt #<span id="attemptNumber">0</span></div>
        <div id="guessTitleContainer" class="hidden">
            <div id="guessTitle" class="guess-title"></div>
        </div>
        <div id="comparisonContainer" class="comparison-grid hidden"></div>

        <div class="guesses-section" id="guessesSectionContainer">
            <div class="guesses-title">Your Guesses</div>
            <div id="guessesTableContainer">
                <table id="guessesTable">
                    <thead>
                        <tr>
                            <th class="attempt-col">Attempt</th>
                            <th class="tea-name-col">Tea Name</th>
                        </tr>
                    </thead>
                    <tbody id="guessesTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
